# O ciclo de uma colaboração: da pergunta à verificação — e de volta.

- name: { pt: Pergunta, en: Question }
  text:
    pt: "Uma pergunta matemática precisa: um invariante a entender, um objeto a encontrar, uma equação a resolver, uma conjectura a testar."
    en: "A precise mathematical question: an invariant to understand, an object to find, an equation to solve, a conjecture to test."
  output: { pt: "enunciado + o que já se sabe", en: "statement + what is known" }

- name: { pt: Representação, en: Representation }
  text:
    pt: "Traduzir os objetos em dados — pesos, amostras de pontos numa variedade, grafos, coeficientes — e escolher o que medir: uma perda, um escore, um invariante."
    en: "Translate the objects into data — weights, point samples on a manifold, graphs, coefficients — and choose what to measure: a loss, a score, an invariant."
  output: { pt: "dados + funcional", en: "data + functional" }

- name: { pt: Experimento, en: Experiment }
  text:
    pt: "Treinar, buscar ou aproximar: redes neurais, perdas do tipo PINN, regressão simbólica, metaheurísticas, modelos de linguagem."
    en: "Train, search or approximate: neural networks, PINN-style losses, symbolic regression, metaheuristics, language models."
  output: { pt: "código reprodutível", en: "reproducible code" }

- name: { pt: Interpretação, en: Interpretation }
  text:
    pt: "Dos números de volta à matemática: que variáveis importam, que fórmula se ajusta, que padrão sugere uma conjectura."
    en: "From numbers back to mathematics: which features matter, which formula fits, which pattern suggests a conjecture."
  output: { pt: "conjecturas + candidatos", en: "conjectures + candidates" }

- name: { pt: Verificação, en: Verification }
  text:
    pt: "Certificar o que for possível — aritmética exata, álgebra computacional, estimativas de erro, prova formal ou demonstração tradicional — dizendo sempre o que é evidência e o que é teorema."
    en: "Certify whatever can be certified — exact arithmetic, computer algebra, error estimates, formal or traditional proof — always saying what is evidence and what is a theorem."
  output: { pt: "resultado + proveniência", en: "result + provenance" }
