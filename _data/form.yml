# ─────────────────────────────────────────────────────────────
#  Formulário "Colabore" → Google Apps Script → e-mail do laboratório (com o PDF)
#
#  1. Instale tools/form-backend.gs em script.google.com (veja README, seção "Formulário").
#  2. Implante como "App da Web" e cole aqui o URL que termina em /exec.
#
#  Enquanto `endpoint` estiver vazio, o site abre um e-mail pré-preenchido
#  para `contact_email` (definido em _config.yml).
# ─────────────────────────────────────────────────────────────

