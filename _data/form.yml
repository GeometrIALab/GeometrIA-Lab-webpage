# ─────────────────────────────────────────────────────────────
#  Formulário "Colabore" → Google Apps Script → e-mail do laboratório (com o PDF)
#
#  1. Instale tools/form-backend.gs em script.google.com (veja README, seção "Formulário").
#  2. Implante como "App da Web" e cole aqui o URL que termina em /exec.
#
#  Enquanto `endpoint` estiver vazio, o site abre um e-mail pré-preenchido
#  para `contact_email` (definido em _config.yml).
# ─────────────────────────────────────────────────────────────

endpoint: "https://script.google.com/macros/s/AKfycbwC0rgNQVW6nr6YqqNIZE1EJTOAz6FCz6TYx5g-E-nJ2gZS0e_p5JToXPsiUSqycljX/exec"

# Só aceita proposta com e-mail confirmado por um código de 6 dígitos (modo endpoint).
# Mantenha igual a VERIFY_EMAIL no script: mude os dois juntos.
verify_email: true

# Anti-robô ALTCHA ("Eu não sou um robô"), só no modo endpoint. O desafio vem do próprio script.
# Com verify_email, protege o pedido de código; sem ele, o envio da proposta.
# Mantenha igual a ALTCHA_REQUIRED no script: mude os dois juntos.
altcha: true

# Tamanho máximo do PDF anexado (MB). Mantenha igual a MAX_PDF_MB no script.
max_pdf_mb: 10
