<!doctype html>
{%- assign L = page.lang | default: "pt" -%}
{%- assign C = site.data.text.common %}
<html lang="{{ C.html_lang[L] }}">
<head>
{% include head.html %}
</head>
<body class="page-{{ page.ref }}">
  <a class="skip-link" href="#main">{{ C.skip[L] }}</a>
  {% include header.html %}
  <main id="main" tabindex="-1">
{{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  {%- for s in page.scripts %}
  <script src="{{ '/assets/js/' | append: s | relative_url }}" defer></script>
  {%- endfor %}
</body>
</html>
